[package]
name = "kicad-mcp"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "A fast, local-first Model Context Protocol server for KiCad"
license = "GPL-3.0-or-later"
repository = "https://github.com/jfr4nc0/kicad-mcp-rs"
keywords = ["kicad", "mcp", "pcb", "eda", "ai"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
hex = "0.4"
nng = "1.0.1"
prost = "0.14"
prost-types = "0.14"
rmcp = { version = "3.4", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "io-std", "signal", "sync", "time", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }
wait-timeout = "0.2"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
