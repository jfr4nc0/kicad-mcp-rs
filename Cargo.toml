[package]
name = "kicad-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, local-first Model Context Protocol server for KiCad"
license = "GPL-3.0-or-later"
repository = "https://github.com/jfr4nc0/kicad-mcp-rs"
keywords = ["kicad", "mcp", "pcb", "eda", "ai"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
rmcp = { version = "3.4", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
